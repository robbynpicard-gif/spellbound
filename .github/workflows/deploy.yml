# Publish the stable game and a playable preview from the development branch.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, codex/gameplay-iteration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build development preview
        run: |
          mkdir -p /tmp/typel-main-dist
          cp -a dist/. /tmp/typel-main-dist/
      - uses: actions/checkout@v4
        with:
          ref: codex/gameplay-iteration
          clean: true
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Assemble stable and preview sites
        run: |
          mkdir -p /tmp/typel-main-dist/preview
          cp -a dist/. /tmp/typel-main-dist/preview/
          rm -rf dist
          mv /tmp/typel-main-dist dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Publish the stable game at /spellbound/ and the isolated development prototype at /spellbound/preview/.
# The preview is sourced from the dev branch; production game files always come from main.
# Pages deployment runs must originate on main due to github-pages environment branch restrictions.
# Development branch changes are validated separately and included on the next main deployment.
# Refresh isolated preview with Arcane Volley sound-design accents (2026-11-20).
# Production remains sourced exclusively from main; preview from the dev branch.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: production/package-lock.json
      - name: Validate and build production
        working-directory: production
        run: |
          npm ci
          npm run check
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: dev/apprenticeship-prototype-20261119
          path: development
      - name: Build development game independently
        working-directory: development
        run: |
          npm ci
          npm run check
      - name: Install Phaser development build under preview
        run: |
          mkdir -p production/dist/preview
          cp -R development/dist/. production/dist/preview/
      - name: Stamp preview with actual development commit
        run: |
          DEV_SHA=$(git -C development rev-parse --short HEAD)
          sed -i "s/TYPAL · DEV PREVIEW · BUILD [^<]*/TYPAL · DEV PREVIEW · BUILD ${DEV_SHA}/" production/dist/preview/index.html
          grep -q "TYPAL · DEV PREVIEW · BUILD ${DEV_SHA}" production/dist/preview/index.html
      - name: Verify preview is Typal and contains built assets
        run: |
          test -f production/dist/preview/index.html
          grep -q 'TYPAL · DEV PREVIEW' production/dist/preview/index.html
          test -d production/dist/preview/assets
          find production/dist/preview/assets -type f -name '*.js' | grep -q .
          if grep -q 'src="/src/main.ts"' production/dist/preview/index.html; then
            echo 'Preview still contains unbuilt source entry point' >&2
            exit 1
          fi
      - name: Preserve preview as a static Pages directory
        run: |
          touch production/dist/.nojekyll
          printf 'Typal preview published from %s\\n' "$(git -C development rev-parse --short HEAD)" > production/dist/preview/health.txt
          test -f production/dist/preview/index.html
          test -f production/dist/preview/health.txt
          test -f production/dist/.nojekyll
          echo 'Pages artifact top-level:'
          ls -la production/dist
          echo 'Preview artifact directory:'
          ls -la production/dist/preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

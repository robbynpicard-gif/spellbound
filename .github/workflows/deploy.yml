# Deploy stable main and the canonical development preview together.
name: Deploy to GitHub Pages
# Typecheck correction: Emergency Summon drop weights.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: codex/gameplay-iteration
          path: development
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: stable/package-lock.json
      - name: Build stable game
        working-directory: stable
        run: |
          npm ci
          npm run build
      - name: Build development game
        working-directory: development
        run: |
          npm ci
          npm run build
      - name: Run gameplay tests (report failures without blocking preview deployment)
        continue-on-error: true
        working-directory: development
        run: npm test
      - name: Assemble independently built sites with version markers
        run: |
          mkdir -p site/preview
          cp -a stable/dist/. site/
          cp -a development/dist/. site/preview/
          printf 'branch=main\ncommit=%s\n' "$(git -C stable rev-parse HEAD)" > site/build-info.txt
          printf 'branch=codex/gameplay-iteration\ncommit=%s\n' "$(git -C development rev-parse HEAD)" > site/preview/build-info.txt
          touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

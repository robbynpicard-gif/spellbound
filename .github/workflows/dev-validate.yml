name: Validate development prototype
on:
  push:
    branches:
      - 'dev/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Upload browser build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: typel-dev-build
          path: dist
